name: Generate Topic Indexes

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-topics]

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Credentials
        run: |
          git config --global user.name "shreyashpatel"
          git config --global user.email "shreyashpatel5506@gmail.com"

      - name: Run Topic Indexer
        run: node scripts/topics.js

      - name: Commit & Push Topics
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add topics/
            git commit -m "chore(topics): refresh topic category indexes"
            git push
          else
            echo "No topic changes to commit."
          fi
