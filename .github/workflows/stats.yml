name: Generate Statistics

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-stats]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Credentials
        run: |
          git config --global user.name "shreyashpatel"
          git config --global user.email "shreyashpatel5506@gmail.com"

      - name: Run Stats Generator
        run: node scripts/stats.js

      - name: Commit & Push Stats
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add stats/
            git commit -m "chore(stats): refresh repository statistics"
            git push
          else
            echo "No stats changes to commit."
          fi
